name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: botforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Setup server (one-time)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /var/www/botforge
            if ! which node; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt install -y nodejs
            fi
            which pm2 || npm install -g pm2
            which nginx || apt install -y nginx

      - name: Setup nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            cat > /etc/nginx/sites-available/botforge <<'NGX'
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
NGX
            ln -sf /etc/nginx/sites-available/botforge /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx || true

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync files
        run: |
          rsync -avz --delete \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.next/cache \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.SERVER_HOST }}:/var/www/botforge/

      - name: Install deps & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/botforge
            npm install --production 2>&1
            ls -la .next/ 2>&1 | head -5
            pm2 delete botforge 2>/dev/null || true
            pm2 start node_modules/.bin/next --name botforge -- start -p 3000
            pm2 save
            sleep 3
            pm2 status
            curl -s -o /dev/null -w "Health: %{http_code}" http://localhost:3000/ || echo "App not responding"
