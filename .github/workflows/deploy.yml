name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: botforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static export
        run: |
          npm ci
          npm run build

      - name: Setup server (one-time)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /var/www/botforge
            which nginx || apt install -y nginx

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync static build
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            out/ root@${{ secrets.SERVER_HOST }}:/var/www/botforge/

      - name: Setup nginx (only once)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ ! -f /etc/nginx/sites-available/botforge ]; then
              mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
              printf '%s\n' 'server {' '    listen 80;' '    server_name detectai.su www.detectai.su;' '    root /var/www/botforge;' '    index index.html;' '    location / {' '        try_files $uri $uri/ /index.html;' '    }' '}' > /etc/nginx/sites-available/botforge
              ln -sf /etc/nginx/sites-available/botforge /etc/nginx/sites-enabled/
              rm -f /etc/nginx/sites-enabled/default
              nginx -t && systemctl reload nginx || true
            fi
