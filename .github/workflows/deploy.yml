name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: '-avz --delete --exclude=node_modules --exclude=.git --exclude=.next/cache'
          SOURCE: '.'
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: root
          TARGET: /var/www/botforge/

      - name: Restart app on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/botforge
            npm install --production
            pm2 delete botforge 2>/dev/null || true
            pm2 start npm --name botforge -- start
            pm2 save
