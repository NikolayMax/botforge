name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: botforge
    steps:
      - uses: actions/checkout@v4

      - name: Setup server (one-time)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /var/www/botforge
            if ! which node; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt install -y nodejs
            fi
            which pm2 || npm install -g pm2
            which nginx || apt install -y nginx

      - name: Deploy source code
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: '-avz --delete --exclude=node_modules --exclude=.git --exclude=.next'
          SOURCE: '.'
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: root
          TARGET: /var/www/botforge/

      - name: Setup nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cp /var/www/botforge/server/nginx.conf /etc/nginx/sites-available/botforge
            ln -sf /etc/nginx/sites-available/botforge /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx || true

      - name: Install deps, build & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/botforge
            npm install 2>&1
            npx next build 2>&1
            pm2 delete botforge 2>/dev/null || true
            pm2 start npm --name botforge -- start
            pm2 save
